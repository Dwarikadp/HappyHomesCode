  <style>
    :root{
      --aubergine:#062c24; --plum:#0d4a3a; --plum-2:#082e23;
      --gold:#e6c14a; --gold-2:#f2d36a; --cream:#faf3eb;
      --wa:#25d366; --wa-2:#1ebe5b;
      --f-display:'Cormorant Garamond',Georgia,serif;
      --f-body:'Inter',system-ui,-apple-system,sans-serif;
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *,*::before,*::after{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0; font-family:var(--f-body); color:var(--cream);
      background:var(--aubergine);
      min-height:100vh; display:grid; place-items:center;
      padding:24px; position:relative; overflow:hidden;
      -webkit-font-smoothing:antialiased;
    }
    /* WebGL aurora canvas sits behind everything */
    #aurora{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block;}
    .glow-fallback{position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(60% 55% at 50% 0%, rgba(230,193,74,.18), transparent 60%),
        radial-gradient(50% 50% at 85% 90%, rgba(13,74,58,.9), transparent 60%),
        radial-gradient(40% 40% at 10% 100%, rgba(230,193,74,.10), transparent 60%),
        linear-gradient(180deg,#083127,#062c24);
    }
    .card{
      position:relative; z-index:2; width:100%; max-width:520px;
      background:linear-gradient(160deg, rgba(9,46,35,.86), rgba(6,44,36,.92));
      border:1px solid rgba(230,193,74,.32);
      border-radius:26px; padding:48px 40px;
      text-align:center;
      box-shadow:0 40px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(250,243,235,.06);
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      animation:rise .7s var(--ease) both;
    }
    @keyframes rise{from{opacity:0; transform:translateY(18px) scale(.98);} to{opacity:1; transform:none;}}
    .brand{display:inline-flex; align-items:center; gap:10px; margin-bottom:26px; opacity:.95;}
    .brand img{width:40px; height:40px;}
    .brand span{font-family:var(--f-display); font-style:italic; font-size:18px; color:var(--cream); line-height:1;}
    .brand small{display:block; font-family:var(--f-body); font-style:normal; font-size:8.5px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-2); margin-bottom:2px;}
    .check{
      width:84px; height:84px; margin:0 auto 22px; border-radius:50%;
      display:grid; place-items:center;
      background:radial-gradient(circle at 50% 40%, rgba(230,193,74,.25), rgba(230,193,74,.08));
      border:1px solid rgba(230,193,74,.5);
      box-shadow:0 0 0 8px rgba(230,193,74,.06);
    }
    .check svg{width:40px; height:40px;}
    .check svg path{stroke-dasharray:40; stroke-dashoffset:40; animation:draw .7s .35s var(--ease) forwards;}
    @keyframes draw{to{stroke-dashoffset:0;}}
    h1{
      font-family:var(--f-display); font-weight:600; font-style:italic;
      font-size:clamp(38px,7vw,54px); line-height:1; margin:0 0 14px;
      color:var(--cream);
    }
    h1 em{color:var(--gold); font-style:italic;}
    .lead{font-size:15.5px; line-height:1.65; color:rgba(250,243,235,.82); max-width:400px; margin:0 auto 30px;}
    .lead b{color:var(--gold-2); font-weight:600;}
    .actions{display:flex; flex-direction:column; gap:14px; max-width:340px; margin:0 auto;}
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:16px 24px; border-radius:999px; font-weight:700;
      font-size:13px; letter-spacing:.08em; text-transform:uppercase;
      border:1.6px solid transparent; cursor:pointer; text-decoration:none;
      transition:transform .2s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
    }
    .btn:hover{transform:translateY(-2px);}
    .btn--wa{background:var(--wa); color:#03251a; box-shadow:0 10px 26px rgba(37,211,102,.32);}
    .btn--wa:hover{background:var(--wa-2); box-shadow:0 14px 32px rgba(37,211,102,.42);}
    .btn--home{background:transparent; color:var(--cream); border-color:rgba(230,193,74,.55);}
    .btn--home:hover{background:rgba(230,193,74,.12); border-color:var(--gold);}
    .note{margin-top:24px; font-size:12px; color:rgba(250,243,235,.5);}
    .note a{color:var(--gold-2);}
    @media (max-width:480px){ .card{padding:38px 24px;} }
    @media (prefers-reduced-motion:reduce){
      .card,.check svg path{animation:none !important; opacity:1 !important; transform:none !important; stroke-dashoffset:0 !important;}
    }
  </style>

  <div class="glow-fallback" aria-hidden="true"></div>

  <main class="card" role="main">
    <a class="brand" href="index.html" aria-label="Happy Homes home">
      <img src="assets/logo-mark.svg" alt="" />
      <span><small>Code Name</small>Happy Homes</span>
    </a>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f2d36a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    </div>

    <h1>Thank <em>You</em>.</h1>
    <p class="lead" id="leadMsg">Your enquiry is in. Our team will reach you within working hours. <b id="broLine">Your brochure has started downloading.</b></p>

    <div class="actions">
      <a class="btn btn--wa" id="waBtn" href="https://wa.me/919777999724" target="_blank" rel="noopener">
        <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16.04 4C10.42 4 5.86 8.56 5.86 14.18c0 1.98.55 3.83 1.51 5.42L6 26l6.6-1.73a10.12 10.12 0 004.04.82h.01c5.62 0 10.18-4.56 10.18-10.18 0-2.72-1.06-5.27-2.98-7.19A10.13 10.13 0 0016.04 4zm0 18.55h-.01a8.4 8.4 0 01-4.29-1.18l-.31-.18-3.82 1 1.02-3.72-.2-.32a8.37 8.37 0 01-1.28-4.46c0-4.62 3.76-8.38 8.39-8.38 2.24 0 4.34.87 5.93 2.45a8.36 8.36 0 012.46 5.93c0 4.62-3.76 8.38-8.39 8.38zm4.6-6.27c-.25-.13-1.49-.74-1.72-.82-.23-.08-.4-.13-.57.13-.17.25-.65.82-.8.99-.15.17-.3.19-.55.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.25-1.49-1.4-1.74-.15-.25-.02-.39.11-.51.11-.11.25-.3.38-.45.13-.15.17-.25.25-.42.08-.17.04-.32-.02-.45-.06-.13-.57-1.38-.78-1.88-.2-.49-.41-.43-.57-.43h-.49c-.17 0-.45.06-.68.32-.23.25-.89.87-.89 2.13 0 1.25.91 2.46 1.04 2.63.13.17 1.79 2.74 4.34 3.85.61.26 1.08.42 1.45.54.61.19 1.16.17 1.6.1.49-.07 1.49-.61 1.7-1.2.21-.59.21-1.09.15-1.2-.07-.11-.23-.17-.48-.3z"/></svg>
        Chat on WhatsApp
      </a>
      <a class="btn btn--home" href="index.html">Back to Home</a>
    </div>

    <p class="note">Prefer a call? <a href="tel:+919777999724">+91 97779 99724</a></p>
  </main>

  <script>
    /* ---- Pull the WhatsApp link + brochure flag stashed by the form on the previous page ---- */
    (function(){
      var data = {};
      try { data = JSON.parse(sessionStorage.getItem('chh_lead') || '{}'); } catch(e){}
      var waBtn = document.getElementById('waBtn');
      if (data.wa && waBtn) waBtn.href = data.wa;

      /* Fire GA4 conversion event (in addition to the /thank-you pageview) */
      try {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: 'generate_lead', form_source: data.source || 'unknown', currency: 'INR', value: 1 });
        if (typeof gtag === 'function') {
          gtag('event', 'generate_lead', { form_source: data.source || 'unknown', currency: 'INR', value: 1 });
        }
      } catch(e){}

      /* Brochure download happens here so the file is not interrupted by the redirect */
      var broLine = document.getElementById('broLine');
      if (data.brochure) {
        try {
          var a = document.createElement('a');
          a.href = 'assets/brochure.pdf';
          a.download = 'Happy-Homes-Brochure.pdf';
          a.rel = 'noopener';
          document.body.appendChild(a);
          setTimeout(function(){ a.click(); setTimeout(function(){ a.remove(); }, 400); }, 600);
        } catch(e){}
      } else if (broLine) {
        broLine.textContent = 'We will be in touch on WhatsApp shortly.';
      }

      /* clear so a refresh does not re-download */
      try { sessionStorage.removeItem('chh_lead'); } catch(e){}
    })();

    /* ---------- Lightweight WebGL aurora (no libraries) ---------- */
    (function(){
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canvas = document.getElementById('aurora');
      var gl = null;
      try { gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl'); } catch(e){}
      if (!gl) { canvas.style.display = 'none'; return; }

      var vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }';
      var fs = [
        'precision highp float;',
        'uniform vec2 u_res; uniform float u_time;',
        // smooth value noise
        'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }',
        'float noise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); vec2 u=f*f*(3.0-2.0*f);',
        '  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x), u.y); }',
        'float fbm(vec2 p){ float v=0.0; float a=0.5; for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.02+vec2(1.7,9.2); a*=0.5; } return v; }',
        'void main(){',
        '  vec2 uv = gl_FragCoord.xy / u_res.xy;',
        '  vec2 q = uv; q.x *= u_res.x/u_res.y;',
        '  float t = u_time*0.06;',
        '  float f = fbm(q*1.9 + vec2(t*0.6, -t*0.35));',
        '  float g = fbm(q*2.8 + f*1.4 - vec2(t*0.5, t*0.75));',
        '  vec3 deep = vec3(0.018,0.098,0.078);',
        '  vec3 green = vec3(0.05,0.29,0.227);',
        '  vec3 gold = vec3(0.955,0.805,0.34);',
        '  vec3 col = mix(deep, green, smoothstep(0.18,0.95,f));',
        '  float ribbon = smoothstep(0.5,0.96,g) * (0.55 + 0.45*sin(u_time*0.38 + uv.y*6.0 + f*4.0));',
        '  col += gold * ribbon * 0.55;',
        '  float d = length(uv - vec2(0.5,0.42));',
        '  col += gold * smoothstep(0.8,0.0,d) * 0.16;',
        '  float spk = pow(noise(uv*u_res.xy*0.35 + u_time*2.0), 22.0);',
        '  col += gold * spk * 0.4;',
        '  col *= 0.5 + 0.62*smoothstep(1.2,0.12,d);',
        '  gl_FragColor = vec4(col,1.0);',
        '}'
      ].join('\n');

      function sh(type, src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; }
      var prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.style.display='none'; return; }
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var uRes = gl.getUniformLocation(prog, 'u_res');
      var uTime = gl.getUniformLocation(prog, 'u_time');

      function resize(){
        var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
        gl.viewport(0,0,canvas.width,canvas.height);
      }
      window.addEventListener('resize', resize); resize();

      var start = performance.now();
      function frame(now){
        var t = (now - start)/1000;
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uTime, t);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        if (!reduce) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
