<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Code Name Happy Homes">
  <defs>
    <style>
      .gold { fill: none; stroke: #e6c14a; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; }
      .gold-fill { fill: #e6c14a; }
      .eyebrow { fill: #e6c14a; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 16px; letter-spacing: 6.5px; font-weight: 500; }
      .wordmark { fill: currentColor; font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 30px; letter-spacing: 2.2px; font-weight: 500; }
    </style>
  </defs>

  <!-- Interlocking 4-loop knot mark, gold -->
  <g transform="translate(120 95)">
    <!-- Top loop -->
    <path class="gold" d="M -22 -52 C -22 -75, 22 -75, 22 -52 C 22 -34, 8 -28, 0 -22 C -8 -28, -22 -34, -22 -52 Z"/>
    <!-- Right loop -->
    <path class="gold" d="M 52 -22 C 75 -22, 75 22, 52 22 C 34 22, 28 8, 22 0 C 28 -8, 34 -22, 52 -22 Z"/>
    <!-- Bottom loop -->
    <path class="gold" d="M 22 52 C 22 75, -22 75, -22 52 C -22 34, -8 28, 0 22 C 8 28, 22 34, 22 52 Z"/>
    <!-- Left loop -->
    <path class="gold" d="M -52 22 C -75 22, -75 -22, -52 -22 C -34 -22, -28 -8, -22 0 C -28 8, -34 22, -52 22 Z"/>
    <!-- Inner woven diamond -->
    <path class="gold" d="M 0 -16 L 16 0 L 0 16 L -16 0 Z"/>
    <!-- Small connector dots -->
    <circle class="gold-fill" cx="0" cy="-22" r="2.5"/>
    <circle class="gold-fill" cx="22" cy="0" r="2.5"/>
    <circle class="gold-fill" cx="0" cy="22" r="2.5"/>
    <circle class="gold-fill" cx="-22" cy="0" r="2.5"/>
  </g>

  <!-- "CODE NAME" eyebrow -->
  <text x="120" y="208" text-anchor="middle" class="eyebrow">CODE NAME</text>

  <!-- "HAPPY HOMES" wordmark (uses currentColor so it adapts to context) -->
  <text x="120" y="246" text-anchor="middle" class="wordmark">HAPPY HOMES</text>
</svg>
